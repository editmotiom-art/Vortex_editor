<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="estilo.css">
<style>
  body { width: 380px; padding: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 7px; border: 1px solid var(--borda); background: rgba(255,255,255,.05); color: var(--texto2); border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .tabs button.on { background: rgba(138,63,252,.28); color: #fff; border-color: #8a3ffc; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; max-height: 300px; overflow: auto; }
  .card-m { background: rgba(255,255,255,.06); border: 1px solid var(--borda); border-radius: 10px; padding: 6px; font-size: 11px; text-align: center; }
  .card-m img, .card-m video { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 6px; background: #000; }
  .card-m .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--texto2); margin: 4px 0 2px; }
  .card-m button { width: 100%; padding: 5px; border: 0; border-radius: 7px; background: var(--roxo); color: #fff; font-size: 11px; cursor: pointer; }
  .card-m button.sec { background: rgba(255,255,255,.12); margin-top: 4px; }
  .aviso { font-size: 11px; line-height: 1.5; color: var(--amarelo, #fbbf24); background: rgba(251,191,36,.1); border-left: 2px solid #fbbf24; padding: 7px 9px; border-radius: 0 6px 6px 0; margin-bottom: 8px; display: none; }
  .linha { display: flex; gap: 6px; }
  .linha > * { flex: 1; }
</style>
</head>
<body>
  <div class="topo">
    <img src="icons/48.png" alt="">
    <div><h1>Vortex Mídia</h1><p class="sub">Baixe e envie direto para o editor</p></div>
  </div>

  <div class="tabs">
    <button id="tab-pagina" class="on">Nesta página</button>
    <button id="tab-link">Colar link</button>
  </div>

  <div class="aviso" id="aviso"></div>

  <div id="painel-pagina">
    <div class="linha">
      <button class="btn" id="capturar">⟳ Capturar mídias da página</button>
    </div>
    <div class="status" id="st1" role="status"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="painel-link" hidden>
    <label for="url">Link do vídeo / imagem</label>
    <input type="url" id="url" placeholder="https://..." spellcheck="false">
    <label for="qualidade">Qualidade</label>
    <select id="qualidade">
      <option value="2160">2160p (4K)</option>
      <option value="1440">1440p (2K)</option>
      <option value="1080">1080p (Full HD)</option>
      <option value="720">720p (HD)</option>
      <option value="480">480p</option>
      <option value="360">360p</option>
      <option value="audio">Somente áudio (MP3)</option>
    </select>
    <button class="btn" id="baixar">⬇ Baixar pelo motor</button>
    <div class="status" id="st2" role="status"></div>
    <div class="grid" id="grid2"></div>
  </div>

  <div class="rodape">
    <span><a href="#" id="opcoes">Opções</a> · <a href="#" id="abrir-editor">Abrir editor</a></span>
    <span>v2.0</span>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
