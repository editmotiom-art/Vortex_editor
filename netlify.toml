[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: qualquer rota cai no index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# headers de segurança + isolamento de origem
# (COOP/COEP habilitam SharedArrayBuffer — necessário para ffmpeg.wasm multithread
#  nas próximas versões, e não atrapalha o editor atual)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# cache agressivo dos assets com hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# service worker / html sem cache
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
